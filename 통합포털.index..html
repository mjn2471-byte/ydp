<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 청소년 방과후 프로그램 통합 포털</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
    body {
      font-family: 'Pretendard', sans-serif;
      background: #f8fafc;
      color: #1e293b;
      word-break: keep-all;
    }
    .program-card {
      transition: all .3s ease;
      border-top: 5px solid #e2e8f0;
      cursor: pointer;
      background: #fff;
      border-radius: 1.5rem;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .program-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 25px -5px rgba(0,0,0,.1);
    }
    .category-line {
      width: 40px;
      height: 5px;
      border-radius: 10px;
      margin-bottom: 1rem;
    }
    .info-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .9rem;
      color: #475569;
      font-weight: 600;
    }

    #viewer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 9999;
      flex-direction: column;
    }
    .viewer-header {
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e7eb;
    }
    #detail-iframe {
      width: 100%;
      height: calc(100vh - 64px);
      border: none;
    }
  </style>
</head>

<body>

<header class="text-center py-20">
  <h1 class="text-4xl md:text-5xl font-black">
    2026 청소년 방과후 프로그램
  </h1>
</header>

<main class="max-w-7xl mx-auto px-6">
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

    <!-- 디지털 드로잉 -->
    <div class="program-card" style="border-top-color:#6366f1"
      onclick="openDetail('digital-drawing','디지털 드로잉')">
      <div class="category-line bg-indigo-500"></div>
      <h3 class="text-2xl font-black mb-2">디지털 드로잉</h3>
      <p class="text-slate-500 text-sm mb-4">
        태블릿을 활용해 나만의 작품을 완성하는 디지털 미술 활동
      </p>
      <div class="info-item">
        <i class="fa-solid fa-calendar"></i> 매주 목요일 16:00 ~ 18:00
      </div>
    </div>

    <!-- 청소년 메이커스 -->
    <div class="program-card" style="border-top-color:#10b981"
      onclick="openDetail('makers','청소년 메이커스')">
      <div class="category-line bg-emerald-500"></div>
      <h3 class="text-2xl font-black mb-2">청소년 메이커스</h3>
      <p class="text-slate-500 text-sm mb-4">
        생활 공예 활동을 통해 창의력과 소근육 사용을 기르는 프로그램
      </p>
      <div class="info-item">
        <i class="fa-solid fa-calendar"></i> 매주 월요일 17:00 ~ 18:00
      </div>
    </div>

    <!-- 청소년 라이프 up -->
    <div class="program-card" style="border-top-color:#0891b2"
      onclick="openDetail('lifeup','청소년 라이프 up')">
      <div class="category-line bg-cyan-600"></div>
      <h3 class="text-2xl font-black mb-2">청소년 라이프 up</h3>
      <p class="text-slate-500 text-sm mb-4">
        자기관리와 일상생활기술을 단계적으로 익히는 자립 준비 프로그램
      </p>
      <div class="info-item">
        <i class="fa-solid fa-calendar"></i> 매주 화요일 17:30 ~ 19:00
      </div>
    </div>

  </div>
</main>

<!-- 상세 뷰어 -->
<div id="viewer-overlay">
  <div class="viewer-header">
    <strong id="viewer-title"></strong>
    <button onclick="closeDetail()">닫기</button>
  </div>
  <iframe id="detail-iframe"></iframe>
</div>

<script>
  const DETAIL_PAGES = {
    digital-drawing: `
      <html>
      <head>
        <meta charset="UTF-8">
        <script src="https://cdn.tailwindcss.com"><\/script>
      </head>
      <body class="p-10">
        <h1 class="text-4xl font-black mb-4">디지털 드로잉</h1>
        <p>상세페이지 예시입니다.</p>
      </body>
      </html>
    `,
    makers: `
      <html><body class="p-10"><h1>청소년 메이커스</h1></body></html>
    `,
    lifeup: `
      <html><body class="p-10"><h1>청소년 라이프 up</h1></body></html>
    `
  };

  function openDetail(key, title) {
    document.getElementById('viewer-title').innerText = title;
    document.getElementById('detail-iframe').srcdoc = DETAIL_PAGES[key];
    document.getElementById('viewer-overlay').style.display = 'flex';
  }

  function closeDetail() {
    document.getElementById('viewer-overlay').style.display = 'none';
    document.getElementById('detail-iframe').srcdoc = '';
  }
</script>

</body>
</html>
